[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyr-mcp-server"
version = "1.0.0"
description = "Production-grade Zephyr RTOS MCP server and agent skill set"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp<2", "pyyaml", "networkx", "flask", "typer", "rich"]

[project.scripts]
zephyr-mcp = "zephyr_mcp.core.server:main"
zephyr-mcp-cli = "zephyr_mcp.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
zephyr_mcp = ["dashboard/templates/*.html"]
